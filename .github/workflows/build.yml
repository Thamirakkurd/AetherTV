name: Build & Release AetherTV v2

on:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run Unit Tests & Build Debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AetherTV-v2.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherTV-v2-debug-apk
          path: AetherTV-v2.apk
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AetherTV-v2.apk
          generate_release_notes: true
